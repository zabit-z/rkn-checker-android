name: RKNChecker
options:
  bundleIdPrefix: com.zabit
  deploymentTarget:
    iOS: 17.0
    macOS: 14.0
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_PREVIEWS: YES

targets:
  RKNChecker:
    type: application
    platform: iOS
    sources:
      - path: RKNChecker
    info:
      path: RKNChecker/App/Info.plist
      properties:
        CFBundleDisplayName: "RKN Checker"
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_NAME: "RKNChecker"
        PRODUCT_BUNDLE_IDENTIFIER: "com.zabit.rknchecker"
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: "AccentColor"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: "RKNChecker/App/Info.plist"
        CODE_SIGN_STYLE: "Automatic"

  RKNCheckerMac:
    type: application
    platform: macOS
    sources:
      - path: RKNChecker
        excludes:
          - App/Info.plist
          - App/RKNCheckerApp.swift
      - path: RKNCheckerMac
    settings:
      base:
        PRODUCT_NAME: "RKNChecker"
        PRODUCT_BUNDLE_IDENTIFIER: "com.example.rknchecker.mac"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        COMBINE_HIDPI_IMAGES: YES
        CODE_SIGN_IDENTITY: "-"

  RKNCheckerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/RKNCheckerTests
    dependencies:
      - target: RKNChecker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "com.zabit.rkncheckerTests"
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/RKNChecker.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/RKNChecker"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  RKNChecker:
    build:
      targets:
        RKNChecker: all
        RKNCheckerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RKNCheckerTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  RKNCheckerMac:
    build:
      targets:
        RKNCheckerMac: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
